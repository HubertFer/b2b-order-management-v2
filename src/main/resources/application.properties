spring.application.name=b2b-order-management-v2
server.port=8081
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.default-produces-media-type=application/json

notification.outbox.relay-interval=PT1S
notification.outbox.batch-size=50
notification.outbox.drain-timeout=PT10S

notification.publisher=log
notification.kafka.topic=order-status-changed
notification.kafka.partitions=3
notification.kafka.send-timeout=PT5S

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=partner-notifications
spring.kafka.consumer.auto-offset-reset=earliest
